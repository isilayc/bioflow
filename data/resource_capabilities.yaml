dada2:
  name: DADA2
  aliases:
  - DADA2
  - dada2
  - DADA2 assignTaxonomy
  - DADA2 taxonomy
  - DADA2 taxonomy assignment
  resource_type: package
  scope: step_and_workflow
  feature_strategies:
  - asv
  markers:
  - 16S
  - 18S
  - ITS
  - any
  operations:
  - asv_inference
  - taxonomy_assignment
  sequencing:
  - Illumina
  read_types:
  - Paired-end
  - Single-end
  components:
    asv_inference: DADA2 denoising/inference
    taxonomy_assignment: assignTaxonomy / assignSpecies
  notes:
  - DADA2 is an ASV method, not an OTU-clustering method.
  - Taxonomic assignment can be performed directly with DADA2 using an appropriately formatted training reference.
  evidence_urls:
  - https://benjjneb.github.io/dada2/
  - https://benjjneb.github.io/dada2/training.html
  operation_profiles:
    asv_inference:
      feature_strategies:
      - asv
      scope: step
    taxonomy_assignment:
      feature_strategies:
      - asv
      - otu
      - motu
      scope: step
      display_name: DADA2 assignTaxonomy
qiime2:
  name: QIIME 2
  aliases:
  - QIIME 2
  - QIIME2
  - QIIME
  - QIIME 2 feature-classifier
  - q2-feature-classifier
  resource_type: framework
  scope: framework
  feature_strategies:
  - asv
  - otu
  markers:
  - 16S
  - 18S
  - ITS
  - any
  operations:
  - primer_trimming
  - asv_inference
  - otu_clustering
  - taxonomy_assignment
  - alpha_diversity
  - beta_diversity
  - differential_abundance
  - amplicon_end_to_end
  sequencing:
  - Illumina
  - any
  read_types:
  - Paired-end
  - Single-end
  - any
  components:
    asv_inference: q2-dada2 or q2-deblur
    otu_clustering: q2-vsearch (dereplication followed by clustering)
    taxonomy_assignment: q2-feature-classifier
  notes:
  - QIIME 2 is a framework, not one algorithm.
  - OTU clustering is supported through q2-vsearch.
  - Generic QIIME 2 should not be presented as a drop-in replacement for a specific workflow step; the relevant plugin should
    be named.
  evidence_urls:
  - https://amplicon-docs.qiime2.org/en/stable/how-to-guides/cluster-reads-into-otus/
  - https://library.qiime2.org/plugins/qiime2/q2-feature-classifier/overview
  operation_profiles:
    primer_trimming:
      feature_strategies:
      - asv
      - otu
      scope: framework
    asv_inference:
      feature_strategies:
      - asv
      scope: framework
    otu_clustering:
      feature_strategies:
      - asv
      - otu
      scope: framework
    taxonomy_assignment:
      feature_strategies:
      - asv
      - otu
      scope: framework
    alpha_diversity:
      feature_strategies:
      - asv
      - otu
      scope: framework
    beta_diversity:
      feature_strategies:
      - asv
      - otu
      scope: framework
    differential_abundance:
      feature_strategies:
      - asv
      - otu
      scope: framework
    amplicon_end_to_end:
      feature_strategies:
      - asv
      - otu
      scope: framework
qiime2_vsearch:
  name: QIIME 2 q2-vsearch OTU workflow
  aliases:
  - q2-vsearch
  - QIIME 2 vsearch
  - QIIME2 vsearch
  resource_type: framework_component
  scope: multi_step
  feature_strategies:
  - otu
  markers:
  - 16S
  - 18S
  - ITS
  - any
  operations:
  - otu_clustering
  sequencing:
  - Illumina
  - any
  read_types:
  - Paired-end
  - Single-end
  - any
  requirements:
  - QIIME 2 OTU clustering requires a feature table plus representative sequences; paired reads must be prepared/merged
    and sequences dereplicated before clustering.
  notes:
  - This is a valid OTU route, but it is a multi-step q2-vsearch workflow rather than a single raw-read clustering command.
  evidence_urls:
  - https://library.qiime2.org/plugins/qiime2/q2-vsearch/overview
  - https://amplicon-docs.qiime2.org/en/stable/how-to-guides/cluster-reads-into-otus/
  operation_profiles:
    otu_clustering:
      feature_strategies:
      - otu
      scope: multi_step
silvangs:
  name: SILVAngs
  aliases:
  - SILVAngs
  - SILVA NGS
  - SILVA-NGS
  resource_type: web_service
  scope: end_to_end
  feature_strategies:
  - otu
  markers:
  - 16S
  - 18S
  operations:
  - otu_clustering
  - taxonomy_assignment
  - amplicon_end_to_end
  sequencing:
  - Illumina
  - any
  read_types:
  - preprocessed_fasta
  input_formats:
  - FASTA
  requirements:
  - Input is Multi-FASTA; paired-end assembly/demultiplexing must be handled before upload.
  - The SILVAngs workflow dereplicates, clusters at a user-defined OTU threshold and classifies OTUs/reads.
  notes:
  - SILVAngs is an OTU-based end-to-end rDNA analysis service.
  - It must not be recommended as an ASV taxonomy-assignment step after DADA2.
  - It is best represented as an alternative whole OTU workflow/service.
  evidence_urls:
  - https://www.arb-silva.de/fileadmin/silva_databases/sngs/SILVAngs_User_Guide.pdf
  - https://www.arb-silva.de/documentation/silvangs/userfaq/
  operation_profiles:
    otu_clustering:
      feature_strategies:
      - otu
      scope: end_to_end
    taxonomy_assignment:
      feature_strategies:
      - otu
      scope: end_to_end
    amplicon_end_to_end:
      feature_strategies:
      - otu
      scope: end_to_end
obitools4:
  name: OBITools4
  aliases:
  - OBITools4
  - OBITools
  - OBItools
  resource_type: toolkit
  scope: composable_workflow
  feature_strategies:
  - motu
  markers:
  - 16S
  - 18S
  - ITS
  - COI
  - any
  operations:
  - paired_read_merging
  - dereplication
  - pcr_aware_denoising
  - taxonomy_assignment
  - amplicon_end_to_end
  sequencing:
  - Illumina
  - any
  read_types:
  - Paired-end
  - Single-end
  - any
  components:
    paired_read_merging: obipairing
    dereplication: obiuniq
    pcr_aware_denoising: obiclean
    taxonomy_assignment: obitag
  notes:
  - OBITools4 is a toolkit for composing DNA metabarcoding workflows, not a fixed ASV or classical percent-identity OTU
    pipeline.
  - obiclean performs PCR-aware denoising/clustering and reports MOTU-like sequence groups.
  - obitag performs reference-based taxonomic assignment.
  evidence_urls:
  - https://obitools4.metabarcoding.org/
  - https://obitools4.metabarcoding.org/obitools/obiclean/
  - https://obitools4.metabarcoding.org/obitools/obitag/
  operation_profiles:
    paired_read_merging:
      feature_strategies:
      - motu
      scope: composable_workflow
    dereplication:
      feature_strategies:
      - motu
      scope: composable_workflow
    pcr_aware_denoising:
      feature_strategies:
      - motu
      scope: composable_workflow
    taxonomy_assignment:
      feature_strategies:
      - motu
      scope: composable_workflow
    amplicon_end_to_end:
      feature_strategies:
      - motu
      scope: composable_workflow
