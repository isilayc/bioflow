- id: mag_single
  title: Metagenome — single-sample MAG reconstruction
  workflow_id: metagenome_illumina_mag_single
  context:
    sample_type: Metagenome
    sequencing: Illumina
    read_type: Paired-end
    goal: MAG reconstruction
  required_operations:
  - raw_read_qc
  - read_preprocessing
  - metagenome_assembly
  - assembly_qc
  - read_mapping
  - alignment_processing
  - coverage_estimation
  - genome_binning
  - bin_refinement
  - mag_quality
  - mag_taxonomy
  forbidden_operations:
  - asv_inference
  - differential_expression
  key_steps:
    metagenome_assembly:
      accepted_any:
      - megahit
      - metaspades
      min_candidates: 2
    genome_binning:
      accepted_any:
      - semibin2
      - metabat2
      - maxbin2
      - concoct
      min_candidates: 3
      mode: parallel
    bin_refinement:
      accepted_any:
      - dastool
    mag_quality:
      accepted_any:
      - checkm2
    mag_taxonomy:
      accepted_any:
      - gtdbtk
      - catbat
      - sourmash
      min_candidates: 2
      required_any_fallback:
      - catbat
      - sourmash
