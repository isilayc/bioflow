schema_version: 1
benchmark_name: BioFlow Scientific Recommendation Benchmark v1
description: Curated workflow-content benchmark for representative bioinformatics use cases. Hard checks validate workflow
  resolution, essential analysis stages, accepted tool families, forbidden stage leakage, and fallback redundancy.
cases:
- id: bacterial_illumina_wgs
  title: Bacterial isolate — Illumina WGS
  workflow_id: bacterial_illumina_wgs
  context:
    sample_type: Bacterial isolate
    sequencing: Illumina
    read_type: Paired-end
    goal: Whole genome characterization
  required_operations:
  - raw_read_qc
  - read_preprocessing
  - genome_assembly
  - assembly_qc
  - genome_annotation
  forbidden_operations:
  - metagenome_assembly
  - genome_binning
  - viral_sequence_detection
  key_steps:
    genome_assembly:
      accepted_any:
      - spades
      - shovill
    assembly_qc:
      accepted_any:
      - quast
    genome_annotation:
      accepted_any:
      - bakta
      - prokka
      min_candidates: 2
- id: bacterial_nanopore_wgs
  title: Bacterial isolate — Oxford Nanopore WGS
  workflow_id: bacterial_nanopore_wgs
  context:
    sample_type: Bacterial isolate
    sequencing: Oxford Nanopore
    read_type: Long reads
    goal: Whole genome characterization
  required_operations:
  - raw_read_qc
  - read_preprocessing
  - genome_assembly
  - assembly_qc
  - genome_annotation
  forbidden_operations:
  - asv_inference
  - genome_binning
  key_steps:
    raw_read_qc:
      accepted_any:
      - nanoplot
    genome_assembly:
      accepted_any:
      - flye
      - raven
      min_candidates: 2
    genome_annotation:
      accepted_any:
      - bakta
      - prokka
